# Example view with Energy Bill cards only. Paste it in: Edit dashboard > raw configuration editor.
# Replace ENTRY_ID in both statistic IDs with the lowercase integration entry ID.
# Find the IDs under Developer Tools > Statistics (see README).
views:
  - title: Energy
    path: energy
    cards:
      - type: entities
        title: Current month
        entities:
          - entity: sensor.energy_bill_month_supplier_cost_to_date
            name: Cost to date
          - entity: sensor.energy_bill_month_supplier_cost
            name: Projected cost
          - entity: sensor.energy_bill_month_prepayment
            name: Prepayment
      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.energy_bill_period_balance
            name: Balance (positive means refund)
          - type: entities
            title: Billing period
            entities:
              - entity: sensor.energy_bill_period_import
                name: Import
              - entity: sensor.energy_bill_period_supplier_cost
                name: Supplier cost
              - entity: sensor.energy_bill_period_prepayment
                name: Prepayments
      - type: entities
        title: Price
        entities:
          - entity: sensor.energy_bill_price_buy
            name: Buy
          - entity: sensor.energy_bill_price_sell
            name: Sell
      - type: statistics-graph
        title: Supplier cost and prepayment per month
        period: month
        chart_type: bar
        days_to_show: 365
        stat_types:
          - mean
        entities:
          - entity: energy_bill:ENTRY_ID_supplier_cost
            name: Supplier cost
          - entity: energy_bill:ENTRY_ID_prepay
            name: Prepayment
