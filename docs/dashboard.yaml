# Example Energy Bill view. Paste it in: Edit dashboard > raw configuration editor.
# The month and period sensors have no state_class, so Home Assistant records no
# long-term statistics for them. The cost graph therefore uses history-graph
# (recorder history), not statistics-graph.
views:
  - title: Energy
    path: energy
    cards:
      - type: energy-date-selection
      - type: energy-distribution
        link_dashboard: true
      - type: energy-usage-graph
      - type: energy-solar-graph
      - type: energy-sources-table
      - type: entities
        title: Current month
        entities:
          - entity: sensor.energy_bill_month_supplier_cost_to_date
            name: Cost to date
          - entity: sensor.energy_bill_month_supplier_cost
            name: Projected cost
          - entity: sensor.energy_bill_month_prepayment
            name: Prepayment
      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.energy_bill_period_balance
            name: Balance (positive means refund)
          - type: entities
            title: Billing period
            entities:
              - entity: sensor.energy_bill_period_import
                name: Import
              - entity: sensor.energy_bill_period_supplier_cost
                name: Supplier cost
              - entity: sensor.energy_bill_period_prepayment
                name: Prepayments
      - type: entities
        title: Price
        entities:
          - entity: sensor.energy_bill_price_buy
            name: Buy
          - entity: sensor.energy_bill_price_sell
            name: Sell
      - type: history-graph
        title: Supplier cost and prepayment per month
        hours_to_show: 720
        entities:
          - entity: sensor.energy_bill_month_supplier_cost
            name: Supplier cost
          - entity: sensor.energy_bill_month_prepayment
            name: Prepayment
