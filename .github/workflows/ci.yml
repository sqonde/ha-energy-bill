name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to complete
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - run: pytest
  hassfest:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # 2026.11.0
  hacs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
  tag:
    needs: [test, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, workshop]
    permissions:
      contents: write
    concurrency:
      group: energy-bill-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Install bump
        shell: bash
        run: |
          set -euo pipefail
          bump_dir=$(mktemp -d)
          echo "BUMP_DIR=$bump_dir" >> "$GITHUB_ENV"
          curl -fsSL https://codeberg.org/sqonde/bump/raw/commit/b13c0ba62bc6d3e710ee9494c585413310af9a44/install.sh | BUMP_VERSION=v0.10.0 BUMP_BIN_DIR="$bump_dir" sh
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git clone "https://github.com/$GITHUB_REPOSITORY.git" "$temp/repo"
          cd "$temp/repo"
          git checkout --detach "$GITHUB_SHA"
          git config user.name sqonde
          git config user.email 23698389+sqonde@users.noreply.github.com
          git tag --points-at HEAD --list 'v*' > "$temp/old-tags"
          existing=$(head -n 1 "$temp/old-tags")
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in 1 2 3; do
            if BUMP_V0=true "$BUMP_DIR/bump" release --push; then
              break
            fi
            tag=$(git tag --points-at HEAD --list 'v*' | grep -Fvx -f "$temp/old-tags" | head -n 1 || true)
            if [ -n "$tag" ]; then
              for push_attempt in 1 2 3; do
                if git push origin "refs/tags/$tag"; then break; fi
                if [ "$push_attempt" = 3 ]; then exit 1; fi
                sleep 5
              done
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          tag=$(git tag --points-at HEAD --list 'v*' | grep -Fvx -f "$temp/old-tags" | head -n 1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Remove bump
        if: always()
        shell: bash
        run: |
          if [ -n "${BUMP_DIR:-}" ]; then rm -rf "$BUMP_DIR"; fi
  release:
    needs: tag
    if: always() && ((github.event_name == 'push' && needs.tag.result == 'success' && needs.tag.outputs.tag != '') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: energy-bill-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.tag.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || needs.tag.outputs.tag }}
          path: release-source
          persist-credentials: false
      - name: Build archive
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path('custom_components/energy_bill')
          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text())
          data['version'] = os.environ['RELEASE_TAG'].removeprefix('v')
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', str(root)])
          with ZipFile('energy_bill.zip', 'w', ZIP_DEFLATED) as archive:
              for name in files.split(b'\0'):
                  if name:
                      path = Path(os.fsdecode(name))
                      info = ZipInfo(str(path.relative_to(root.parent)), (1980, 1, 1, 0, 0, 0))
                      info.compress_type = ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      archive.writestr(info, path.read_bytes())
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || needs.tag.outputs.tag }}
        run: python3 scripts/publish_release.py "$RELEASE_TAG" release-source/energy_bill.zip
